[workspace]
resolver = "2"
members = ["crates/hyprstudio", "crates/linuxaio"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
authors = ["LabtosoStudios"]

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
fancy-regex = "0.14"
async-channel = "2"
ureq = "2"
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
